name: Create Release

on:
  push:
    tags:
      - '[0-9]*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build ZIP
        run: |
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' . hipaypayments/
          mkdir -p dist
          zip -r dist/hipaypayments.zip hipaypayments/
          rm -rf hipaypayments/

      - name: Extract changelog
        id: changelog
        run: |
          VERSION=${{ github.ref_name }}
          NOTES=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HiPay Payments ${{ github.ref_name }}
          target_commitish: ps8
          body: ${{ steps.changelog.outputs.notes }}
          files: dist/hipaypayments.zip

      - name: Download GitLab artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          name: gitlab-data-artifact
          github_token: ${{ github.token }}
          workflow: info-release.yml
          if_no_artifact_found: warn

      - name: Display artifact content
        if: hashFiles('artifact.json') != ''
        run: cat artifact.json

      - name: Prepare and send Slack message
        env:
          GITHUB_PROJECT_NAME: 'HiPay Payments Prestashop 8'
          GITHUB_RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_RELEASE_URL: ${{ steps.release.outputs.url }}
          JIRA_DOMAIN: ${{ vars.JIRA_DOMAIN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_API_TOKEN: ${{ secrets.SLACK_API_TOKEN }}
        run: |-
          curl -s https://raw.githubusercontent.com/hipay/common-workflows/main/scripts/slack-message.js | node
